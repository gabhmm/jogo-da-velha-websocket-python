[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jogo-da-velha-websocket-python"
version = "0.1.0"
description = "Jogo da velha multiplayer via WebSocket em Python com Tornado"
readme = "README.md"
authors = [
    { name = "Gabriel M", email = "digitalrx9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tornado>=6.5.10",
]

[project.scripts]
start = "jogo_da_velha_websocket_python.server.main:main"
server = "jogo_da_velha_websocket_python.server.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pyright]
extraPaths = ["src/jogo_da_velha_websocket_python/server"]